services:
  mysql:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${DB_NAME:-clothing_retail}
      MYSQL_USER: ${DB_USERNAME:-clothing_retail}
      MYSQL_PASSWORD: ${DB_PASSWORD:-clothing_retail}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-clothing_retail_root}
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${MYSQL_ROOT_PASSWORD:-clothing_retail_root}"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
      dockerfile: ../docker/backend.Dockerfile
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      DB_HOST: mysql
      DB_PORT: 3306
      DB_NAME: ${DB_NAME:-clothing_retail}
      DB_USERNAME: ${DB_USERNAME:-clothing_retail}
      DB_PASSWORD: ${DB_PASSWORD:-clothing_retail}
      JWT_SECRET: ${JWT_SECRET:-change-me-in-production-please}
      ADMIN_BOOTSTRAP_EMAIL: ${ADMIN_BOOTSTRAP_EMAIL:-admin@clothingretail.local}
      ADMIN_BOOTSTRAP_PASSWORD: ${ADMIN_BOOTSTRAP_PASSWORD:-ChangeMe123!}
    ports:
      - "8080:8080"

  frontend:
    build:
      context: ./frontend
      dockerfile: ../docker/frontend.Dockerfile
      args:
        VITE_API_BASE_URL: http://localhost:8080/api
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "5173:80"

volumes:
  mysql_data:
