<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Loom Atelier Studio</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!-- Playfair Display: the "Signature" theme motif's display face (ornate/serif).
         Archivo: the "Studio" motif's display face (clean/geometric). Fraunces: the "Élan"
         motif's display face (warm, soft-contrast editorial serif) - see index.css's
         [data-motif="..."] overrides of --font-display. All three are loaded unconditionally
         since which one is actually used depends on the admin-configured active theme, decided
         at runtime, not at build time. -->
    <link
      href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,500;0,600;0,700;1,500&family=Archivo:wght@500;600;700;800&family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
