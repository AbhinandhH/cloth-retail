spring:
  application:
    name: clothing-retail-backend

  datasource:
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:clothing_retail}?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
    username: ${DB_USERNAME:clothing_retail}
    password: ${DB_PASSWORD:clothing_retail}
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: false

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 5MB

server:
  port: 8080

app:
  jwt:
    # Local-dev fallback only. MUST be overridden via the JWT_SECRET env var in any
    # non-local environment - this default is public (it's in source control).
    secret: ${JWT_SECRET:c2FtcGxlLWxvY2FsLWRldi1vbmx5LWp3dC1zZWNyZXQtZG8tbm90LXVzZS1pbi1wcm9kLTEyMzQ1Njc4OTA=}
    access-token-ttl-minutes: 15
    refresh-token-ttl-days: 30
  admin-bootstrap:
    email: ${ADMIN_BOOTSTRAP_EMAIL:admin@clothingretail.local}
    password: ${ADMIN_BOOTSTRAP_PASSWORD:ChangeMe123!}
  cors:
    # Comma-separated list. LAN IP added so the storefront can be tested from a phone
    # on the same network - update/override via CORS_ALLOWED_ORIGIN if the IP changes.
    allowed-origin: ${CORS_ALLOWED_ORIGIN:http://localhost:5173,http://172.20.10.3:5173}
  media:
    upload-dir: ${MEDIA_UPLOAD_DIR:./uploads}
  order:
    # Minutes an order's stock reservation is held while awaiting payment before the scheduled
    # cleanup job (OrderReservationCleanupJob) releases it and cancels the order.
    reservation-ttl-minutes: ${ORDER_RESERVATION_TTL_MINUTES:15}
  payment:
    mock:
      # Local-dev-only shared secret for MockPaymentGateway's HMAC-SHA256 webhook signing/verification.
      # Same story as app.jwt.secret above - override via env var in any non-local environment.
      secret: ${PAYMENT_MOCK_SECRET:c2FtcGxlLWxvY2FsLWRldi1vbmx5LXBheW1lbnQtd2ViaG9vay1zZWNyZXQ=}

springdoc:
  swagger-ui:
    path: /swagger-ui.html
  api-docs:
    path: /v3/api-docs

---
