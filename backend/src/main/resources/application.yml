spring:
  application:
    name: clothing-retail-backend

  datasource:
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:clothing_retail}?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
    username: ${DB_USERNAME:clothing_retail}
    password: ${DB_PASSWORD:clothing_retail}
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: false

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

  servlet:
    multipart:
      # Outer bound only - MediaStorageService enforces the real per-type caps (5MB images,
      # 50MB videos) itself and rejects an oversized image well before this limit. This just
      # needs to be at least as large as the biggest allowed upload (video).
      max-file-size: 55MB
      max-request-size: 55MB

server:
  port: 8080

app:
  jwt:
    # Local-dev fallback only. MUST be overridden via the JWT_SECRET env var in any
    # non-local environment - this default is public (it's in source control).
    secret: ${JWT_SECRET:c2FtcGxlLWxvY2FsLWRldi1vbmx5LWp3dC1zZWNyZXQtZG8tbm90LXVzZS1pbi1wcm9kLTEyMzQ1Njc4OTA=}
    access-token-ttl-minutes: 15
    refresh-token-ttl-days: 30
  admin-bootstrap:
    email: ${ADMIN_BOOTSTRAP_EMAIL:admin@clothingretail.local}
    password: ${ADMIN_BOOTSTRAP_PASSWORD:ChangeMe123!}
  cors:
    # Comma-separated list of origins/origin-patterns (see SecurityConfig - these support
    # "*" wildcards). LAN IP added so the storefront can be tested from a phone on the same
    # network - update/override via CORS_ALLOWED_ORIGIN if the IP changes. The ngrok-domain
    # wildcards cover a public demo (frontend tunneled through ngrok) without needing this
    # updated every time a new random ngrok subdomain is generated.
    allowed-origin: ${CORS_ALLOWED_ORIGIN:http://localhost:5173,http://172.20.10.3:5173,https://*.ngrok-free.app,https://*.ngrok-free.dev,https://*.ngrok.app,https://*.ngrok.io}
  auth:
    # A same-origin local dev setup (frontend and backend sharing localhost) works fine with
    # the default Lax/non-secure cookie. Cross-origin setups - e.g. frontend and backend each
    # tunneled through their own separate ngrok URL for a public demo - need SameSite=None
    # paired with Secure=true instead (a plain Lax cookie is never sent on cross-site
    # XHR/fetch, and browsers ignore SameSite=None unless Secure is also set; ngrok serves
    # https so Secure still works). Override via COOKIE_SECURE=true COOKIE_SAME_SITE=None
    # when running the backend for that kind of demo - don't flip these for same-origin local
    # dev, a Secure cookie is silently rejected over plain http.
    cookie-secure: ${COOKIE_SECURE:false}
    cookie-same-site: ${COOKIE_SAME_SITE:Lax}
  media:
    upload-dir: ${MEDIA_UPLOAD_DIR:./uploads}
  order:
    # Minutes an order's stock reservation is held while awaiting payment before the scheduled
    # cleanup job (OrderReservationCleanupJob) releases it and cancels the order.
    reservation-ttl-minutes: ${ORDER_RESERVATION_TTL_MINUTES:15}
  payment:
    # "mock" (default): MockPaymentGateway, the fake dev/test gateway - no real gateway account
    # needed, drives /api/payments/mock/simulate and the OrderConcurrencyIntegrationTest suite.
    # "razorpay": RazorpayPaymentGateway, a real gateway - see the razorpay.* keys below, both
    # required in that mode. Switching this is the only step needed; nothing else in the app
    # changes code paths at runtime, and MockPaymentGateway keeps working unchanged either way
    # (PaymentService's dev-only simulate endpoint always depends on it directly, regardless of
    # which gateway is actually live) - see PaymentConfig for how the two beans coexist.
    provider: ${PAYMENT_PROVIDER:mock}
    mock:
      # Local-dev-only shared secret for MockPaymentGateway's HMAC-SHA256 webhook signing/verification.
      # Same story as app.jwt.secret above - override via env var in any non-local environment.
      secret: ${PAYMENT_MOCK_SECRET:c2FtcGxlLWxvY2FsLWRldi1vbmx5LXBheW1lbnQtd2ViaG9vay1zZWNyZXQ=}
  otp:
    # Whether each channel is actually used at signup lives in the database now (see
    # NotificationSettings / the admin Notifications module), not here - an admin can flip
    # either on/off live with no restart. These remaining keys are lower-level tuning that
    # isn't exposed in that UI.
    code-length: ${OTP_CODE_LENGTH:6}
    ttl-minutes: ${OTP_TTL_MINUTES:10}
    max-attempts: ${OTP_MAX_ATTEMPTS:5}
    resend-cooldown-seconds: ${OTP_RESEND_COOLDOWN_SECONDS:30}

# Only consulted when app.payment.provider=razorpay (see above) - a test-mode key pair works
# unchanged here, since Razorpay's test and live modes use the same API shape, just different
# key prefixes (rzp_test_... vs rzp_live_...). webhook-secret is set separately in the Razorpay
# dashboard when creating the webhook (Settings -> Webhooks -> add
# https://<your-backend>/api/payments/razorpay/webhook) - it is NOT the same value as key-secret.
razorpay:
  key-id: ${RAZORPAY_KEY_ID:}
  key-secret: ${RAZORPAY_KEY_SECRET:}
  webhook-secret: ${RAZORPAY_WEBHOOK_SECRET:}

springdoc:
  swagger-ui:
    path: /swagger-ui.html
  api-docs:
    path: /v3/api-docs

